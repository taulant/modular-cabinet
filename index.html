<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modular Record Player Organizer — Parametric Blueprint</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="panel-open">
  <main id="stage">
    <svg id="dwg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1500"
         preserveAspectRatio="xMidYMid meet"></svg>
  </main>

  <button id="tab" type="button" aria-controls="panel" aria-expanded="true" aria-label="Hide parameters">&#8250;</button>

  <aside id="panel" aria-label="Drawing parameters"></aside>
</div>

<script src="script.js"></script>
</body>
</html>
